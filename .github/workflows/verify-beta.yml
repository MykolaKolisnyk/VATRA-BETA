name: Verify VATRA-BETA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: |
          for script in assets/js/*.js; do node --check "$script"; done
      - name: Test WebP preview generation and fallback
        run: node tools/media-preview-smoke.mjs
      - name: Verify production Supabase cutover
        run: |
          ! grep -Rl 'rjasunoawrxvetwadylh' assets/js/ --include='*.js'
          ! grep -Rl 'rjasunoawrxvetwadylh' --include='*.html' .
          grep -Fq 'https://cxrcycxrlkufozomsxcs.supabase.co' assets/js/auth-core.js
          grep -Fq 'https://cxrcycxrlkufozomsxcs.supabase.co' assets/js/beta-profile.js
          grep -Fq 'sb_publishable_oKypZDxi8PP1oxSylfh5wQ_H6HxeM-i' assets/js/auth-core.js
          grep -Fq 'sb_publishable_oKypZDxi8PP1oxSylfh5wQ_H6HxeM-i' assets/js/beta-profile.js
          test "$(cat CNAME)" = "vatrasocial.com"
      - name: Verify HTML assets exist
        run: |
          node <<'JS'
          const fs=require("node:fs");
          const assert=require("node:assert/strict");
          for(const page of fs.readdirSync(".").filter(f=>f.endsWith(".html"))){
            const html=fs.readFileSync(page,"utf8");
            for(const match of html.matchAll(/(?:src|href)=["'](assets\/[a-zA-Z0-9_./-]+(?:\?rev=[a-f0-9]{40})?)["']/g)){
              const resource=match[1].split("?")[0];
              assert(fs.existsSync(resource),page+" missing "+resource);
            }
          }
          console.log("All local linked HTML assets exist.");
          JS
  browser:
    # Direct Upload on Cloudflare Pages is manual; test the public deployment after upload.
    if: github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.65.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test public production pages
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          try{
            const cases=[
              ["","login","#login-form"],
              ["create-account","create-account","#signup-form"],
              ["forgot","forgot","#forgot-form"],
              ["reset","reset","#recovery-code-form"],
              ["verify","login","#login-form"]
            ];
            for(const [route,expected,selector] of cases){
              const context=await browser.newContext({serviceWorkers:"block"});
              try{
                const page=await context.newPage(),pageErrors=[];
                page.on("pageerror",error=>pageErrors.push(error.message));
                const url="https://vatrasocial.com/"+route;
                const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:35000});
                assert(response,"No response for "+url);
                await page.waitForFunction(name=>document.body?.dataset?.page===name,expected,{timeout:25000});
                await page.locator(selector).first().waitFor({state:"attached",timeout:15000});
                assert.equal(await page.locator("html[data-vatra-denied]").count(),0,"Host blocked "+url);
                await page.waitForTimeout(1200);
                assert.deepEqual(pageErrors,[],"Runtime JS errors on "+url);
                console.log("BROWSER PASS "+url+" (HTTP "+response.status()+")");
              }finally{await context.close();}
            }
            console.log("Public browser smoke passed; authenticated flows need separate testing.");
          }finally{await browser.close();}
          JS
